# Never also set RUSTFLAGS, which replaces these flags entirely.
[build]
# x86-64-v3 is AVX2, BMI2, POPCNT and friends, and no AVX-512, like the scoring box. The box also has
# carry-less multiply and PREFETCHW, which x86-64-v3 leaves out. The quote masks here don't need the
# multiply. PREFETCHW lets the name table ask for a slot's line with intent to write.
rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "target-feature=+pclmulqdq,+prfchw"]

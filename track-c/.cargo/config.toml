# Never also set RUSTFLAGS, which replaces these flags entirely.
[build]
# x86-64-v3 is AVX2, BMI2, POPCNT and friends, and no AVX-512, like the scoring box. The box also has
# carry-less multiply, which x86-64-v3 leaves out. The quote masks here don't need it.
rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "target-feature=+pclmulqdq"]
